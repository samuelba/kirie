[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/samuelba/kirie"
authors = ["Samuel Bachmann <samuel.bachmann@gmail.com>"]

[workspace.dependencies]
kirie-capture = { path = "crates/kirie-capture" }
kirie-ui = { path = "crates/kirie-ui" }
kirie-annotate = { path = "crates/kirie-annotate" }
kirie-update = { path = "crates/kirie-update" }
serde = { version = "1", features = ["derive", "rc"] }
directories = "6"
jiff = "0.2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
anyhow = "1"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "canvas", "svg", "image-without-codecs", "advanced", "wayland", "web-colors"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
assert_is_empty = "allow"
manual_assert_eq = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
