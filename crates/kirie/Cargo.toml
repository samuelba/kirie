[package]
name = "kirie"
description = "Screenshot and annotation tool for Wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
kirie-capture.workspace = true
kirie-ui.workspace = true
directories.workspace = true
jiff.workspace = true
tokio.workspace = true
kirie-annotate.workspace = true
kirie-update.workspace = true
kurbo = "0.11"
wl-clipboard-rs = "0.9.5"
ron = "0.12"
semver = "1"
serde.workspace = true
xkbcommon = { version = "0.8", default-features = false }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
image.workspace = true
iced.workspace = true
iced_layershell = { version = "0.19.1", default-features = false }
# iced_layershell 0.19 (through iced_exdevtools) breaks on winit-core 0.31.0-beta.3 and later.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"] }
rustix = { version = "1", features = ["pipe", "event"] }
winit-core = "=0.31.0-beta.2"
winit-common = "=0.31.0-beta.2"

[lints]
workspace = true
