name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo clippy --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - name: The screenshot portal client against a fake portal
        run: dbus-run-session -- cargo nextest run --workspace --locked --run-ignored only -E 'test(fake_portal)'
      - run: cargo build --workspace --release --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      # The Wayland clients need a compositor; the headless sway job covers them.
      - run: >-
          cargo llvm-cov nextest --locked --fail-under-lines 80
          --package kirie-annotate --package kirie-capture --package kirie-ui
          --ignore-filename-regex 'kirie-capture/src/wayland'

  smoke:
    name: Headless sway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev sway
      - run: cargo build --locked -p kirie
      - run: scripts/sway-smoke.sh target/smoke
      - name: The capture covers both screens
        run: python3 -c "import struct; f=open('target/smoke/screen.png','rb').read(24); w,h=struct.unpack('>II', f[16:24]); print(w,h); assert (w,h)==(3840,1080), (w,h)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke
          path: target/smoke

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  desktop:
    name: Desktop files and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - run: desktop-file-validate packaging/dev.samuelba.Kirie.desktop
      - run: appstreamcli validate --no-net packaging/dev.samuelba.Kirie.metainfo.xml
      - name: Shell scripts parse
        run: for file in scripts/*.sh; do bash -n "$file"; done
      - name: The installer is POSIX sh
        run: shellcheck --shell=sh scripts/install.sh
      - name: The installer trusts the release key
        run: |
          [ -f packaging/minisign.pub ] || exit 0
          key="$(sed -n 2p packaging/minisign.pub)"
          grep -qx "public_key=\"$key\"" scripts/install.sh
